<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Animated RAFIN mechanical crawler</title>
  <desc id="desc">A cyan and green mechanical crawler travels across a dark code panel.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d16"/>
      <stop offset="1" stop-color="#0b1727"/>
    </linearGradient>
    <filter id="cyanGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .scan{animation:scan 8s linear infinite}.blink{animation:blink 1.4s steps(2,end) infinite}.leg-a{animation:legA .34s ease-in-out infinite alternate}.leg-b{animation:legB .34s ease-in-out infinite alternate}@keyframes scan{0%,12%{opacity:.12}18%,32%{opacity:.72}38%,100%{opacity:.12}}@keyframes blink{50%{opacity:.25}}@keyframes legA{to{transform:translateY(4px)}}@keyframes legB{to{transform:translateY(-4px)}}
  </style>
  <rect x="1" y="1" width="1198" height="258" rx="20" fill="url(#panel)" stroke="#263449"/>
  <circle cx="30" cy="28" r="6" fill="#ef4444"/><circle cx="50" cy="28" r="6" fill="#f59e0b"/><circle cx="70" cy="28" r="6" fill="#22c55e"/>
  <text x="96" y="34" fill="#64748b" font-family="monospace" font-size="14">crawler.ts — RAFIN-G</text>
  <g font-family="monospace" font-size="17">
    <text x="54" y="82" fill="#64748b">01</text><text x="90" y="82" fill="#c084fc">const</text><text x="150" y="82" fill="#f8fafc"> builder</text><text x="228" y="82" fill="#94a3b8"> = </text><text x="250" y="82" fill="#38bdf8">new</text><text x="286" y="82" fill="#f8fafc"> Developer</text><text x="384" y="82" fill="#94a3b8">();</text>
    <text x="54" y="118" fill="#64748b">02</text><text x="90" y="118" fill="#f8fafc">builder.</text><text x="160" y="118" fill="#34d399">ship</text><text x="196" y="118" fill="#94a3b8">(</text><text x="207" y="118" fill="#fbbf24">"real projects"</text><text x="346" y="118" fill="#94a3b8">);</text>
    <text x="54" y="154" fill="#64748b">03</text><text x="90" y="154" fill="#f8fafc">builder.</text><text x="160" y="154" fill="#34d399">explore</text><text x="226" y="154" fill="#94a3b8">([</text><text x="244" y="154" fill="#fbbf24">"security"</text><text x="335" y="154" fill="#94a3b8">, </text><text x="353" y="154" fill="#fbbf24">"AI/ML"</text><text x="425" y="154" fill="#94a3b8">]);</text>
    <text x="54" y="190" fill="#64748b">04</text><text x="90" y="190" fill="#c084fc">while</text><text x="140" y="190" fill="#94a3b8"> (</text><text x="157" y="190" fill="#f8fafc">curious</text><text x="222" y="190" fill="#94a3b8">) </text><text x="244" y="190" fill="#38bdf8">improve</text><text x="310" y="190" fill="#94a3b8">();</text>
  </g>
  <rect class="scan" x="84" y="94" width="286" height="32" rx="6" fill="#22d3ee" opacity=".12"/>
  <g filter="url(#cyanGlow)">
    <animateMotion dur="8s" repeatCount="indefinite" rotate="auto" path="M118 210 C280 202 365 88 520 106 S810 218 1085 92"/>
    <g class="leg-a" stroke="#22d3ee" stroke-width="3" stroke-linecap="round">
      <path d="M-18-4L-42-20L-62-18"/><path d="M-20 4L-48 12L-66 28"/><path d="M18-4L42-20L62-18"/><path d="M20 4L48 12L66 28"/>
    </g>
    <g class="leg-b" stroke="#34d399" stroke-width="3" stroke-linecap="round">
      <path d="M-10-12L-28-36L-46-40"/><path d="M-12 12L-24 38L-44 44"/><path d="M10-12L28-36L46-40"/><path d="M12 12L24 38L44 44"/>
    </g>
    <polygon points="0,-24 25,-11 25,11 0,24 -25,11 -25,-11" fill="#071a20" stroke="#22d3ee" stroke-width="3"/>
    <circle cx="-8" cy="-3" r="4" fill="#f472b6"/><circle cx="8" cy="-3" r="4" fill="#f472b6"/>
    <rect class="blink" x="-10" y="8" width="20" height="4" rx="2" fill="#34d399"/>
  </g>
  <text x="1010" y="230" fill="#475569" font-family="monospace" font-size="12">click to interact</text>
</svg>

