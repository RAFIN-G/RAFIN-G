<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Rafin GitHub profile banner</title>
  <desc id="desc">Dark pixel-tech banner introducing Rafin as a CSE student, developer, and open-source builder.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#071a20"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#334155" stroke-opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <circle cx="1040" cy="70" r="220" fill="url(#glow)"/>
  <rect x="64" y="66" width="5" height="188" rx="2.5" fill="#22d3ee"/>
  <text x="98" y="90" fill="#34d399" font-family="monospace" font-size="14" font-weight="700">&gt; whoami</text>
  <text x="98" y="153" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="56" font-weight="700">Rafin</text>
  <text x="98" y="194" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="21" font-weight="600">CSE Student • Developer • Open-Source Builder</text>
  <text x="98" y="228" fill="#94a3b8" font-family="Arial, sans-serif" font-size="16">Building software, exploring security, and learning AI/ML.</text>
  <text x="98" y="268" fill="#7dd3fc" font-family="monospace" font-size="13">JAVA  •  C++  •  PYTHON (LEARNING)  •  FABRIC  •  PAPER</text>
  <g opacity="0.88">
    <rect x="924" y="92" width="22" height="22" rx="4" fill="#1d4ed8"/>
    <rect x="954" y="122" width="22" height="22" rx="4" fill="#166534"/>
    <rect x="984" y="62" width="22" height="22" rx="4" fill="#1e40af"/>
    <rect x="1014" y="152" width="22" height="22" rx="4" fill="#15803d"/>
    <rect x="1044" y="92" width="22" height="22" rx="4" fill="#1d4ed8"/>
    <rect x="1074" y="182" width="22" height="22" rx="4" fill="#166534"/>
    <rect x="1104" y="122" width="22" height="22" rx="4" fill="#1e40af"/>
  </g>
</svg>

